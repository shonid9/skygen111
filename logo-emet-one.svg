<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="EMET ONE logo">
  <g fill="none" fill-rule="evenodd">
    <!-- Unified E1 monogram: flat, balanced, and legible at small sizes -->
    <path fill="#111111" d="M14 18h58v12H28v12h31v12H28v12h44v12H14z"/>
    <!-- The 1 is integrated as the right structural spine -->
    <path fill="#111111" d="M64 18h18v60H68V34l-10 6V26z"/>
    <!-- Small verification accent -->
    <rect x="14" y="66" width="14" height="12" rx="1.5" fill="#2F5BFF"/>
    <!-- optical cut keeps the E and 1 visually separate without looking fragmented -->
    <rect x="58" y="42" width="10" height="12" fill="#F6F3EC"/>
  </g>
</svg>