<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 862 670" role="img" aria-labelledby="e1Title e1Desc">
  <title id="e1Title">EMET ONE</title>
  <desc id="e1Desc">The EMET ONE monogram: three folded graphite ribbons forming an E, swept into an electric-blue spine that forms a one.</desc>
  <defs>
    <linearGradient id="e1Graphite" x1="0" y1="0" x2=".2" y2="1">
      <stop offset="0" stop-color="#4c535b"/>
      <stop offset=".1" stop-color="#373d45"/>
      <stop offset=".35" stop-color="#23272e"/>
      <stop offset=".65" stop-color="#161a1f"/>
      <stop offset=".9" stop-color="#0e1014"/>
      <stop offset="1" stop-color="#171c23"/>
    </linearGradient>
    <linearGradient id="e1Sweep" gradientUnits="userSpaceOnUse" x1="40" y1="640" x2="800" y2="200">
      <stop offset="0" stop-color="#1c212a"/>
      <stop offset=".26" stop-color="#14181f"/>
      <stop offset=".4" stop-color="#0f1c42"/>
      <stop offset=".52" stop-color="#0a2b8c"/>
      <stop offset=".64" stop-color="#093ec0"/>
      <stop offset=".82" stop-color="#0a49d8"/>
      <stop offset="1" stop-color="#0d52e8"/>
    </linearGradient>
    <linearGradient id="e1Fold" gradientUnits="userSpaceOnUse" x1="10" y1="430" x2="290" y2="215">
      <stop offset="0" stop-color="#0a1130"/>
      <stop offset=".45" stop-color="#1b2c6e"/>
      <stop offset="1" stop-color="#3a4cb4"/>
    </linearGradient>
    <linearGradient id="e1Rim" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="840" y2="650">
      <stop offset="0" stop-color="#cbbcff"/>
      <stop offset=".28" stop-color="#8a76ff"/>
      <stop offset=".55" stop-color="#5566ff"/>
      <stop offset=".8" stop-color="#3f8bff"/>
      <stop offset="1" stop-color="#84b2ff"/>
    </linearGradient>
    <linearGradient id="e1Sheen" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".16" stop-color="#fff" stop-opacity=".2"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="e1SpineV" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="670">
      <stop offset="0" stop-color="#05163f" stop-opacity=".34"/>
      <stop offset=".1" stop-color="#8fbaff" stop-opacity=".08"/>
      <stop offset=".32" stop-color="#d4e6ff" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#94c3ff" stop-opacity=".07"/>
      <stop offset=".78" stop-color="#000a1a" stop-opacity=".14"/>
      <stop offset="1" stop-color="#00050f" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="e1SpineH" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="862" y2="0">
      <stop offset="0" stop-color="#bcdcff" stop-opacity=".26"/>
      <stop offset=".3" stop-color="#8ec2ff" stop-opacity=".08"/>
      <stop offset=".68" stop-color="#001034" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000a1a" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="e1SpineStreak" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="470">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".62" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="e1MaskG" gradientUnits="userSpaceOnUse" x1="540" y1="0" x2="704" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="e1SpineMask"><rect x="536" y="-12" width="346" height="696" fill="url(#e1MaskG)"/></mask>
    <linearGradient id="e1Shade" gradientUnits="objectBoundingBox" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".2"/>
      <stop offset=".4" stop-color="#000" stop-opacity="0"/>
    </linearGradient>

    <path id="e1ArmTop" d="M74 84 L562 60 C578 59 586 68 582 82 L560 160 C556 174 544 180 528 180 L74 200 C46 201 30 190 32 168 C34 140 44 108 56 94 C62 87 68 84 74 84 Z"/>
    <path id="e1ArmMid" d="M56 310 L544 286 C560 285 568 294 564 308 L542 386 C538 400 526 406 510 406 L56 426 C28 427 12 416 14 394 C16 366 26 334 38 320 C44 313 50 310 56 310 Z"/>
    <path id="e1Sweep2" d="M812 8 C844 6 862 26 862 58 L862 468 C862 566 798 642 700 652 L74 668 C36 669 4 648 6 616 C8 580 34 552 78 546 L596 526 C652 522 678 492 678 430 L678 180 C674 156 654 142 626 128 C698 106 762 56 812 8 Z"/>

    <clipPath id="e1CT"><use href="#e1ArmTop"/></clipPath>
    <clipPath id="e1CM"><use href="#e1ArmMid"/></clipPath>
    <clipPath id="e1CS"><use href="#e1Sweep2"/></clipPath>
  </defs>

  <g fill="none" fill-rule="evenodd">
    <path d="M32 160 C26 196 38 230 78 236 C140 244 220 224 286 192 L74 200 C46 201 30 186 32 160 Z" fill="url(#e1Fold)"/>
    <path d="M14 386 C8 422 20 456 60 462 C122 470 202 450 268 418 L56 426 C28 427 12 412 14 386 Z" fill="url(#e1Fold)"/>

    <g clip-path="url(#e1CT)">
      <use href="#e1ArmTop" fill="url(#e1Graphite)"/>
      <use href="#e1ArmTop" fill="url(#e1Shade)"/>
      <path d="M72 95 L556 73" stroke="url(#e1Sheen)" stroke-width="9"/>
      <use href="#e1ArmTop" stroke="url(#e1Rim)" stroke-width="9"/>
    </g>

    <g clip-path="url(#e1CM)">
      <use href="#e1ArmMid" fill="url(#e1Graphite)"/>
      <use href="#e1ArmMid" fill="url(#e1Shade)"/>
      <path d="M54 321 L538 299" stroke="url(#e1Sheen)" stroke-width="9"/>
      <use href="#e1ArmMid" stroke="url(#e1Rim)" stroke-width="9"/>
    </g>

    <g clip-path="url(#e1CS)">
      <use href="#e1Sweep2" fill="url(#e1Sweep)"/>
      <g mask="url(#e1SpineMask)">
        <rect x="536" y="-12" width="346" height="696" fill="url(#e1SpineV)"/>
        <rect x="536" y="-12" width="346" height="696" fill="url(#e1SpineH)"/>
      </g>
      <use href="#e1Sweep2" fill="url(#e1Shade)"/>
      <path d="M78 556 L598 536" stroke="url(#e1Sheen)" stroke-width="9"/>
      <path d="M708 168 L696 448" stroke="url(#e1SpineStreak)" stroke-width="20" stroke-linecap="round"/>
      <use href="#e1Sweep2" stroke="url(#e1Rim)" stroke-width="9"/>
    </g>
  </g>
</svg>
